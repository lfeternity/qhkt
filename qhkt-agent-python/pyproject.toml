[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qhkt-agent-python"
version = "0.1.0"
description = "qhkt learning assistant Python microservice"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "aiosqlite>=0.20,<1",
  "asyncmy>=0.2,<1",
  "httpx>=0.27,<1",
  "PyJWT[crypto]>=2.8,<3",
  "qdrant-client>=1.12,<2",
  "aio-pika>=9.4,<10",
  "redis>=5.0,<6",
  "python-multipart>=0.0.9,<1",
  "prometheus-client>=0.20,<1",
  "opentelemetry-api>=1.25,<2",
  "opentelemetry-sdk>=1.25,<2",
  "langchain-core>=0.3.85,<1",
  "langgraph>=0.6,<1",
  # 0.2.x is the Redis saver line compatible with LangGraph 0.6.x.
  # 0.5.x requires langgraph-checkpoint 4.x, while LangGraph 0.6.x
  # requires checkpoint 2.x, making the previous unconstrained ranges
  # impossible to install in a clean image.
  "langgraph-checkpoint-redis>=0.2.1,<0.3",
  "langsmith>=0.12,<1",
  "langchain-text-splitters>=0.3,<1",
  "langchain>=0.3,<1",
  "pymupdf>=1.24,<2",
  "python-docx>=1.1,<2",
  "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
ai = []
rag = []
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "asgi-lifespan>=2.1,<3",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008", "BLE001"]
